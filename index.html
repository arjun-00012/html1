<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hover Icon Color Change</title>

<!-- Font Awesome CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
  .box {
    width: 250px;
    padding: 20px;
    background: lightgray;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    gap: 10px;
    align-items: center;
    border-radius: 8px;
  }

  .box p {
    margin: 0;
    color: black; 
    font-size: 16px;
  }

  .icon {
    font-size: 30px;
    color: black; /* Default icon color */
    transition: 0.3s;
  }

  /* Hover effect */
  .box:hover {
    background: #007bff;
  }

  .box:hover .icon {
    color: yellow; /* change icon color only */
  }
</style>

</head>
<body>

<div class="box">
  <i class="fa-solid fa-heart icon"></i>
  <p>Hover on this box</p>
  <a href="e1.html">hi</a>
</div>

</body>
</html>
